packages:
  - "apps/*"
  - "packages/*"

# Allow-list for packages whose install/postinstall scripts pnpm otherwise blocks.
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - "@tailwindcss/oxide"
  - esbuild

# Security overrides for transitive dependencies (non-major bumps only).
overrides:
  undici: ">=7.29.1 <8"
  hono: ">=4.13.11 <5"
  "@hono/node-server": ">=1.19.15 <2"
  fast-uri: ">=3.1.8 <4"
  js-yaml: ">=4.3.2 <5"
  ip-address: ">=10.7.4 <11"
  qs: ">=6.16.0 <7"
  brace-expansion@^1: ">=1.1.21 <2"
  "brace-expansion@>=4 <6": ">=5.0.12 <6"
  nanoid@^3: ">=3.3.18 <4"
  postcss: ">=8.5.23 <9"
  browserslist: ">=4.28.7 <5"
  source-map-js: ">=1.2.2 <2"
  proxy-addr: ">=2.0.8 <3"
  postcss-selector-parser: ">=7.1.6 <8"
  "@modelcontextprotocol/sdk": ">=1.32.0 <2"
  baseline-browser-mapping: ">=2.11.0 <3"
