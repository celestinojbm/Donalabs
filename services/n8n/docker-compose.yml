# =============================================================================
# n8n — workflow automation platform (dedicated Postgres 16)
# Part of the DonaLabs shared infrastructure.
# =============================================================================

services:
  n8n_db:
    image: postgres:16-alpine
    container_name: donalabs-n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      TZ: ${TZ:-UTC}
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    networks:
      - n8n_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n} -d ${N8N_DB_NAME:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  n8n:
    image: n8nio/n8n:${N8N_IMAGE_TAG:-2.29.8}
    container_name: donalabs-n8n
    restart: unless-stopped
    depends_on:
      n8n_db:
        condition: service_healthy
    environment:
      # --- database (Postgres) ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n_db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # --- crypto / host ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOSTNAME:-localhost}
      N8N_PORT: "5678"
      # Bind IPv4 explicitly; the default '::' fails on bridges without IPv6.
      N8N_LISTEN_ADDRESS: "0.0.0.0"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      # Secure cookie needs HTTPS; false lets you log in over http://localhost.
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      # Task runners (default in v2.x) execute Code nodes in an isolated runner.
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
    volumes:
      # Holds the auto-generated config (encryption key mirror), binary data, etc.
      - n8n_data:/home/node/.n8n
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${N8N_HOST_PORT:-5678}:5678"
    networks:
      - edge
      - n8n_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  n8n_data:
    name: donalabs_n8n_data
  n8n_db_data:
    name: donalabs_n8n_db_data

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-donalabs_edge}
  n8n_internal:
    name: donalabs_n8n_internal
