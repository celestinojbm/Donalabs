# =============================================================================
# SearXNG — self-hosted metasearch backend for Firecrawl and DonaLabs agents.
# Optional agent infrastructure; only the SearXNG app joins donalabs_edge.
# =============================================================================

services:
  searxng:
    profiles: ["agents"]
    image: ghcr.io/searxng/searxng:${SEARXNG_IMAGE_TAG:-2026.9.17-274b63b67}
    container_name: donalabs-searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8088/}
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      UWSGI_WORKERS: ${SEARXNG_WORKERS:-2}
      UWSGI_THREADS: ${SEARXNG_THREADS:-2}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SEARXNG_HOST_PORT:-8088}:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    depends_on:
      - searxng-valkey
    networks:
      - searxng_internal
      - donalabs_edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  searxng-valkey:
    profiles: ["agents"]
    image: docker.io/valkey/valkey:9-alpine
    container_name: donalabs-searxng-valkey
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - searxng_valkey_data:/data
    networks:
      - searxng_internal
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  donalabs_edge:
    external: true
    name: ${EDGE_NETWORK:-donalabs_edge}
  searxng_internal:
    name: donalabs_searxng_internal
    internal: true

volumes:
  searxng_cache:
    name: donalabs_searxng_cache
  searxng_valkey_data:
    name: donalabs_searxng_valkey_data
