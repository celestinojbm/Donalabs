# =============================================================================
# Nango — shared OAuth/API integration layer for DonaLabs products and agents.
#
# The server joins donalabs_edge; Postgres and Redis remain private.
# Start from repo root:
#   ./start.sh nango-server
# =============================================================================

services:
  nango-server:
    profiles: ["agents"]
    image: nangohq/nango-server:${NANGO_IMAGE_TAG:-hosted}
    container_name: donalabs-nango
    platform: linux/amd64
    restart: unless-stopped
    environment:
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY}
      NANGO_DB_USER: ${NANGO_DB_USER:-nango}
      NANGO_DB_PASSWORD: ${NANGO_DB_PASSWORD}
      NANGO_DB_HOST: nango-db
      NANGO_DB_NAME: ${NANGO_DB_NAME:-nango}
      NANGO_DB_SSL: "false"
      RECORDS_DATABASE_URL: postgresql://${NANGO_DB_USER:-nango}:${NANGO_DB_PASSWORD}@nango-db:5432/${NANGO_DB_NAME:-nango}
      NANGO_REDIS_URL: redis://nango-redis:6379
      SERVER_PORT: 3003
      NANGO_SERVER_URL: ${NANGO_SERVER_URL:-http://localhost:3003}
      NANGO_PUBLIC_SERVER_URL: ${NANGO_PUBLIC_SERVER_URL:-http://localhost:3003}
      FLAG_AUTH_ENABLED: ${NANGO_AUTH_ENABLED:-true}
      NANGO_DASHBOARD_USERNAME: ${NANGO_DASHBOARD_USERNAME:-admin}
      NANGO_DASHBOARD_PASSWORD: ${NANGO_DASHBOARD_PASSWORD}
      LOG_LEVEL: ${NANGO_LOG_LEVEL:-info}
      FLAG_SERVE_CONNECT_UI: "true"
      NANGO_PUBLIC_CONNECT_URL: ${NANGO_PUBLIC_CONNECT_URL:-http://localhost:3009}
      CONNECT_UI_PORT: 3009
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${NANGO_HOST_PORT:-3003}:3003"
      - "${BIND_ADDR:-127.0.0.1}:${NANGO_CONNECT_UI_PORT:-3009}:3009"
    depends_on:
      nango-db:
    profiles: ["agents"]
        condition: service_healthy
      nango-redis:
    profiles: ["agents"]
        condition: service_started
    networks:
      - nango_internal
      - donalabs_edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nango-db:
    image: postgres:16.0-alpine
    container_name: donalabs-nango-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NANGO_DB_USER:-nango}
      POSTGRES_PASSWORD: ${NANGO_DB_PASSWORD}
      POSTGRES_DB: ${NANGO_DB_NAME:-nango}
    volumes:
      - nango_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NANGO_DB_USER:-nango} -d ${NANGO_DB_NAME:-nango}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nango_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nango-redis:
    image: redis:7.2.4-alpine
    container_name: donalabs-nango-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --bind 0.0.0.0
    volumes:
      - nango_redis_data:/data
    networks:
      - nango_internal
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  donalabs_edge:
    external: true
    name: ${EDGE_NETWORK:-donalabs_edge}
  nango_internal:
    name: donalabs_nango_internal
    internal: true

volumes:
  nango_postgres_data:
    name: donalabs_nango_postgres_data
  nango_redis_data:
    name: donalabs_nango_redis_data
